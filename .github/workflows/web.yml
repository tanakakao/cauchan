name: Web build

on:
  pull_request:
    paths:
      - "web/**"
      - "start_web.bat"
      - "pyproject.toml"
      - "src/cauchan/api/app.py"
      - "src/cauchan/api/inference_service.py"
      - "src/cauchan/api/schemas.py"
      - "src/cauchan/models/**"
      - "tests/test_causal_effect_estimator.py"
      - "tests/test_web_port_configuration.py"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "start_web.bat"
      - "pyproject.toml"
      - "src/cauchan/api/app.py"
      - "src/cauchan/api/inference_service.py"
      - "src/cauchan/api/schemas.py"
      - "src/cauchan/models/**"
      - "tests/test_causal_effect_estimator.py"
      - "tests/test_web_port_configuration.py"
      - ".github/workflows/web.yml"

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows launcher
        shell: cmd
        run: call start_web.bat check

  model-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install inference dependencies
        run: >-
          python -m pip install
          "numpy>=1.26,<2.0"
          "pandas>=2.1,<3.0"
          "scikit-learn>=1.4,<1.7"
          "networkx>=3.2"
          "dowhy>=0.11"
          "econml>=0.15"
          "lightgbm>=4.0"
      - name: Run model inference tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_causal_effect_estimator

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate reserved ports
        run: python -m unittest discover -s tests -p "test_web_port_configuration.py"
      - name: Validate Python syntax
        run: python -m compileall -q src/cauchan/api src/cauchan/models
      - name: Install dependencies
        working-directory: web
        run: npm install
      - name: Build
        working-directory: web
        run: npm run build
