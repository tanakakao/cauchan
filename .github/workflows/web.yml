name: Web build

on:
  pull_request:
    paths:
      - "web/**"
      - "start_web.bat"
      - "pyproject.toml"
      - "src/cauchan/api/app.py"
      - "src/cauchan/api/inference_service.py"
      - "src/cauchan/api/schemas.py"
      - "src/cauchan/preprocessing/**"
      - "src/cauchan/models/**"
      - "tests/test_causal_effect_estimator.py"
      - "tests/test_missing_values.py"
      - "tests/test_web_port_configuration.py"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "start_web.bat"
      - "pyproject.toml"
      - "src/cauchan/api/app.py"
      - "src/cauchan/api/inference_service.py"
      - "src/cauchan/api/schemas.py"
      - "src/cauchan/preprocessing/**"
      - "src/cauchan/models/**"
      - "tests/test_causal_effect_estimator.py"
      - "tests/test_missing_values.py"
      - "tests/test_web_port_configuration.py"
      - ".github/workflows/web.yml"

permissions:
  contents: write

jobs:
  apply-path-recovery:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply missing directed path recovery
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page_path = Path("web/src/pages/ConversationPage.tsx")
          page = page_path.read_text(encoding="utf-8")

          helper_anchor = (
              'function progressGroup(stage: Stage): string {\n'
              '  if (stage === "columns" || stage === "categorical") return "variables";\n'
              '  if (stage === "source" || stage === "manual" || stage === "algorithm") return "structure";\n'
              '  if (stage === "treatment" || stage === "outcome") return "query";\n'
              '  if (stage === "confirm") return "method";\n'
              '  return stage;\n'
              '}\n'
          )
          helper_replacement = helper_anchor + (
              '\n'
              'function isMissingDirectedPathError(message: string): boolean {\n'
              '  return /有向経路がありません|有向経路が存在しません/.test(message);\n'
              '}\n'
          )
          if "function isMissingDirectedPathError" not in page:
              if helper_anchor not in page:
                  raise SystemExit("progressGroup anchor not found")
              page = page.replace(helper_anchor, helper_replacement, 1)

          error_pattern = re.compile(
              r'    if \(!busy && error\) \{\n'
              r'      setAwaitingInference\(false\);\n'
              r'      setStage\("confirm"\);\n'
              r'      append\("assistant", "因果効果を推定できませんでした。因果構造と推定条件を確認してください。"\);\n'
              r'    \}\n'
              r'  \}, \[awaitingInference, inference, busy, error\]\);'
          )
          error_replacement = (
              '    if (!busy && error) {\n'
              '      setAwaitingInference(false);\n'
              '      if (isMissingDirectedPathError(error)) {\n'
              '        setDraftTreatment("");\n'
              '        setDraftOutcome("");\n'
              '        setStage("treatment");\n'
              '        append(\n'
              '          "assistant",\n'
              '          `${error} 因果構造は維持しています。介入変数と結果変数の組み合わせを選び直してください。`,\n'
              '        );\n'
              '        setError(null);\n'
              '        return;\n'
              '      }\n'
              '      setStage("confirm");\n'
              '      append("assistant", "因果効果を推定できませんでした。因果構造と推定条件を確認してください。");\n'
              '    }\n'
              '  }, [awaitingInference, inference, busy, error]);'
          )
          if "if (isMissingDirectedPathError(error))" not in page:
              page, replacements = error_pattern.subn(error_replacement, page, count=1)
              if replacements != 1:
                  raise SystemExit(f"inference error branch replacements: {replacements}")
          page_path.write_text(page, encoding="utf-8")

          test_path = Path("web/test/conversationMode.test.mjs")
          tests = test_path.read_text(encoding="utf-8")
          test_block = (
              '\n\n'
              'test("missing directed path errors return to inference factor selection", () => {\n'
              '  assert.match(pageSource, /function isMissingDirectedPathError/);\n'
              '  assert.match(pageSource, /有向経路がありません\\|有向経路が存在しません/);\n'
              '  assert.match(\n'
              '    pageSource,\n'
              '    /if \\(isMissingDirectedPathError\\(error\\)\\)[\\s\\S]*setDraftTreatment\\(""\\)[\\s\\S]*setDraftOutcome\\(""\\)[\\s\\S]*setStage\\("treatment"\\)[\\s\\S]*setError\\(null\\)/,\n'
              '  );\n'
              '  assert.match(pageSource, /因果構造は維持しています。介入変数と結果変数の組み合わせを選び直してください。/);\n'
              '});\n'
          )
          if 'test("missing directed path errors return to inference factor selection"' not in tests:
              test_path.write_text(tests.rstrip() + test_block, encoding="utf-8")
          PY
      - name: Commit recovery changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/pages/ConversationPage.tsx web/test/conversationMode.test.mjs
          if git diff --cached --quiet; then
            echo "Recovery changes already applied"
            exit 0
          fi
          git commit -m "Recover from missing causal paths"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows launcher
        shell: cmd
        run: call start_web.bat check

  model-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install inference dependencies
        run: >-
          python -m pip install
          "numpy>=1.26,<2.0"
          "pandas>=2.1,<3.0"
          "scikit-learn>=1.4,<1.7"
          "networkx>=3.2"
          "dowhy>=0.11"
          "econml>=0.15"
          "lightgbm>=4.0"
      - name: Run model and preprocessing tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest
          tests.test_causal_effect_estimator
          tests.test_missing_values

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate reserved ports
        run: python -m unittest discover -s tests -p "test_web_port_configuration.py"
      - name: Validate Python syntax
        run: python -m compileall -q src/cauchan/api src/cauchan/preprocessing src/cauchan/models
      - name: Install dependencies
        working-directory: web
        run: npm install
      - name: Build
        working-directory: web
        run: npm run build
