name: Apply conversation path recovery

on:
  push:
    branches:
      - agent/fix-conversation-and-imputation
    paths:
      - .github/workflows/apply-conversation-path-recovery.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-conversation-and-imputation
          fetch-depth: 0

      - name: Apply targeted recovery changes
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path = Path("web/src/pages/ConversationPage.tsx")
          page = page_path.read_text(encoding="utf-8")

          old_helper_anchor = '''function progressGroup(stage: Stage): string {
            if (stage === "columns" || stage === "categorical") return "variables";
            if (stage === "source" || stage === "manual" || stage === "algorithm") return "structure";
            if (stage === "treatment" || stage === "outcome") return "query";
            if (stage === "confirm") return "method";
            return stage;
          }
          '''
          new_helper_anchor = '''function progressGroup(stage: Stage): string {
            if (stage === "columns" || stage === "categorical") return "variables";
            if (stage === "source" || stage === "manual" || stage === "algorithm") return "structure";
            if (stage === "treatment" || stage === "outcome") return "query";
            if (stage === "confirm") return "method";
            return stage;
          }

          function isMissingDirectedPathError(message: string): boolean {
            return /有向経路がありません|有向経路が存在しません/.test(message);
          }
          '''
          if old_helper_anchor not in page:
              raise SystemExit("progressGroup anchor not found")
          page = page.replace(old_helper_anchor, new_helper_anchor, 1)

          old_error_branch = '''    if (!busy && error) {
              setAwaitingInference(false);
              setStage("confirm");
              append("assistant", "因果効果を推定できませんでした。因果構造と推定条件を確認してください。");
            }
          }, [awaitingInference, inference, busy, error]);
          '''
          new_error_branch = '''    if (!busy && error) {
              setAwaitingInference(false);
              if (isMissingDirectedPathError(error)) {
                setDraftTreatment("");
                setDraftOutcome("");
                setStage("treatment");
                append(
                  "assistant",
                  `${error} 因果構造は維持しています。介入変数と結果変数の組み合わせを選び直してください。`,
                );
                setError(null);
                return;
              }
              setStage("confirm");
              append("assistant", "因果効果を推定できませんでした。因果構造と推定条件を確認してください。");
            }
          }, [awaitingInference, inference, busy, error]);
          '''
          if old_error_branch not in page:
              raise SystemExit("inference error branch not found")
          page = page.replace(old_error_branch, new_error_branch, 1)
          page_path.write_text(page, encoding="utf-8")

          test_path = Path("web/test/conversationMode.test.mjs")
          tests = test_path.read_text(encoding="utf-8")
          test_block = '''

          test("missing directed path errors return to inference factor selection", () => {
            assert.match(pageSource, /function isMissingDirectedPathError/);
            assert.match(pageSource, /有向経路がありません\|有向経路が存在しません/);
            assert.match(
              pageSource,
              /if \(isMissingDirectedPathError\(error\)\)[\s\S]*setDraftTreatment\(""\)[\s\S]*setDraftOutcome\(""\)[\s\S]*setStage\("treatment"\)[\s\S]*setError\(null\)/,
            );
            assert.match(pageSource, /因果構造は維持しています。介入変数と結果変数の組み合わせを選び直してください。/);
          });
          '''
          if 'test("missing directed path errors return to inference factor selection"' not in tests:
              tests = tests.rstrip() + test_block + "\n"
              test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Validate conversation mode
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Commit targeted changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/pages/ConversationPage.tsx web/test/conversationMode.test.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Recover from missing causal paths"
          git push origin HEAD:agent/fix-conversation-and-imputation
