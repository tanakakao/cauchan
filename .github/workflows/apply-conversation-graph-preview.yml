name: Apply conversation graph preview

on:
  push:
    branches:
      - agent/embed-conversation-graph-preview
    paths:
      - .github/workflows/apply-conversation-graph-preview.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/embed-conversation-graph-preview
          fetch-depth: 0

      - name: Add persistent conversation and static graph preview
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("web/src/App.tsx")
          app = app_path.read_text(encoding="utf-8")
          old_render = '''            {conversationOpen
              ? <ConversationPage onOpenStep={openStep} />
              : <Page />}
          '''
          new_render = '''            <div className="conversation-page-host" hidden={!conversationOpen}>
              <ConversationPage onOpenStep={openStep} active={conversationOpen} />
            </div>
            <div className="workbench-page-host" hidden={conversationOpen}>
              <Page />
            </div>
          '''
          if 'className="conversation-page-host"' not in app:
              if old_render not in app:
                  raise SystemExit("App conversation render anchor not found")
              app = app.replace(old_render, new_render, 1)
              app_path.write_text(app, encoding="utf-8")

          page_path = Path("web/src/pages/ConversationPage.tsx")
          page = page_path.read_text(encoding="utf-8")

          import_anchor = 'import ConversationIcon from "../components/ConversationIcon";\n'
          if 'import GraphCanvas from "../components/GraphCanvas";' not in page:
              if import_anchor not in page:
                  raise SystemExit("Conversation import anchor not found")
              page = page.replace(
                  import_anchor,
                  import_anchor + 'import GraphCanvas from "../components/GraphCanvas";\n',
                  1,
              )

          old_props = '''type ConversationPageProps = {
            onOpenStep: (step: WorkbenchStep) => void;
          };
          '''
          new_props = '''type ConversationPageProps = {
            onOpenStep: (step: WorkbenchStep) => void;
            active: boolean;
          };
          '''
          if 'active: boolean;' not in page:
              if old_props not in page:
                  raise SystemExit("Conversation props anchor not found")
              page = page.replace(old_props, new_props, 1)

          old_signature = 'export default function ConversationPage({ onOpenStep }: ConversationPageProps) {'
          new_signature = '''export default function ConversationPage({
            onOpenStep,
            active,
          }: ConversationPageProps) {'''
          if new_signature not in page:
              if old_signature not in page:
                  raise SystemExit("Conversation signature anchor not found")
              page = page.replace(old_signature, new_signature, 1)

          constants_anchor = '''  const directedEdgeCount = editedDiscoveryEdges.filter((edge) => edge.kind === "directed").length;
            const selectedMethod = METHODS.find((method) => method.id === draftMethod) ?? METHODS[0];
            const progressIndex = PROGRESS.findIndex(([id]) => id === progressGroup(stage));
          '''
          constants_replacement = '''  const directedEdgeCount = editedDiscoveryEdges.filter((edge) => edge.kind === "directed").length;
            const selectedMethod = METHODS.find((method) => method.id === draftMethod) ?? METHODS[0];
            const progressIndex = PROGRESS.findIndex(([id]) => id === progressGroup(stage));
            const previewColumns = structureSource === "discovery" && discovery
              ? discovery.columns
              : draftColumns;
            const previewHasStructure = structureSource === "discovery"
              ? Boolean(discovery && editedDiscoveryEdges.length)
              : causalEdges.length > 0;
            const previewGraphSignature = useMemo(() => {
              const edges = structureSource === "discovery"
                ? editedDiscoveryEdges.map((edge) => `${edge.kind}:${edge.source}->${edge.target}`)
                : causalEdges.map((edge) => `${edge.source}->${edge.target}`);
              return `${previewColumns.join("|")}::${edges.sort().join("|")}`;
            }, [structureSource, editedDiscoveryEdges, causalEdges, previewColumns]);
            const previewLayoutVersion = useMemo(
              () => [...`${active}:${previewGraphSignature}`].reduce(
                (hash, character) => ((hash * 31) + character.charCodeAt(0)) | 0,
                0,
              ),
              [active, previewGraphSignature],
            );
          '''
          if 'const previewHasStructure' not in page:
              if constants_anchor not in page:
                  raise SystemExit("Conversation preview constants anchor not found")
              page = page.replace(constants_anchor, constants_replacement, 1)

          thread_anchor = '        <section className="conversation-thread" aria-label="cauchanとの対話">\n'
          thread_replacement = '''        <div className="conversation-main-column">
                  <section className="conversation-thread" aria-label="cauchanとの対話">
          '''
          if 'className="conversation-main-column"' not in page:
              if thread_anchor not in page:
                  raise SystemExit("Conversation thread anchor not found")
              page = page.replace(thread_anchor, thread_replacement, 1)

          preview_anchor = '''        </section>

                  <aside className="conversation-summary" aria-label="現在の因果分析設定">
          '''
          preview_replacement = '''        </section>

                  {previewHasStructure && (
                    <section className="conversation-graph-preview" aria-label="推論に使用する因果構造">
                      <div className="conversation-graph-preview-heading">
                        <div>
                          <span>CAUSAL STRUCTURE</span>
                          <h3>推論に使用する因果構造</h3>
                          <p>対話を離れずに構造を確認できます。このプレビューではノード移動やエッジ編集は行いません。</p>
                        </div>
                        <div className="conversation-graph-preview-status">
                          <span>{structureSource === "discovery" ? `探索 · ${discovery?.model_name ?? draftAlgorithm}` : "手動構造"}</span>
                          <strong>{structureSource === "discovery" ? `${directedEdgeCount} directed` : `${causalEdges.length} directed`}</strong>
                        </div>
                      </div>
                      <div className="conversation-graph-preview-canvas" aria-readonly="true">
                        {structureSource === "discovery" ? (
                          <GraphCanvas
                            columns={previewColumns}
                            resultEdges={editedDiscoveryEdges}
                            editable={false}
                            layoutVersion={previewLayoutVersion}
                          />
                        ) : (
                          <GraphCanvas
                            columns={previewColumns}
                            causalEdges={causalEdges}
                            editable={false}
                            layoutVersion={previewLayoutVersion}
                          />
                        )}
                      </div>
                      <div className="conversation-graph-preview-footer">
                        <p>
                          {unresolvedDiscoveryEdges > 0
                            ? `未方向エッジが${unresolvedDiscoveryEdges}件あります。推論前に方向を確定してください。`
                            : "表示中の構造を保持したまま、対話で介入変数と結果変数を選択できます。"}
                        </p>
                        <button
                          type="button"
                          className="secondary"
                          onClick={() => onOpenStep(structureSource === "discovery" ? "discovery" : "knowledge")}
                        >
                          {structureSource === "discovery" ? "Discovery画面で編集" : "Knowledge画面で編集"}
                        </button>
                      </div>
                    </section>
                  )}
                </div>

                  <aside className="conversation-summary" aria-label="現在の因果分析設定">
          '''
          if 'className="conversation-graph-preview"' not in page:
              if preview_anchor not in page:
                  raise SystemExit("Conversation preview insertion anchor not found")
              page = page.replace(preview_anchor, preview_replacement, 1)

          page = page.replace(
              '>探索結果を画面で確認</button>',
              '>Discovery画面で編集</button>',
          )
          page_path.write_text(page, encoding="utf-8")

          style_path = Path("web/src/conversation-mode.css")
          style = style_path.read_text(encoding="utf-8")
          style_block = '''

          /* Read-only causal structure shown below the persistent conversation thread. */
          .conversation-page-host[hidden],
          .workbench-page-host[hidden] {
            display: none !important;
          }

          .conversation-main-column {
            min-width: 0;
            display: grid;
            gap: 16px;
          }

          .conversation-graph-preview {
            min-width: 0;
            padding: 17px;
            background: var(--surface-raised);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
          }

          .conversation-graph-preview-heading,
          .conversation-graph-preview-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
          }

          .conversation-graph-preview-heading > div:first-child {
            min-width: 0;
          }

          .conversation-graph-preview-heading span {
            color: var(--primary);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.13em;
          }

          .conversation-graph-preview-heading h3 {
            margin: 4px 0 5px;
            font-size: 18px;
          }

          .conversation-graph-preview-heading p,
          .conversation-graph-preview-footer p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.55;
          }

          .conversation-graph-preview-status {
            flex: 0 0 auto;
            display: grid;
            gap: 3px;
            min-width: 132px;
            padding: 9px 11px;
            text-align: right;
            background: var(--surface-subtle);
            border: 1px solid var(--line);
            border-radius: 11px;
          }

          .conversation-graph-preview-status span {
            letter-spacing: 0;
          }

          .conversation-graph-preview-status strong {
            font-size: 14px;
          }

          .conversation-graph-preview-canvas {
            height: clamp(300px, 36vw, 430px);
            margin-top: 13px;
            overflow: hidden;
            background: var(--surface-subtle);
            border: 1px solid var(--line);
            border-radius: 14px;
            pointer-events: none;
            user-select: none;
          }

          .conversation-graph-preview-canvas .graph-canvas {
            height: 100% !important;
            min-height: 100% !important;
            border: 0;
            border-radius: 0;
            pointer-events: none;
          }

          .conversation-graph-preview-canvas .react-flow__controls,
          .conversation-graph-preview-canvas .react-flow__minimap {
            display: none;
          }

          .conversation-graph-preview-footer {
            margin-top: 12px;
          }

          .conversation-graph-preview-footer p {
            max-width: 720px;
          }

          @media (max-width: 720px) {
            .conversation-graph-preview-heading,
            .conversation-graph-preview-footer {
              align-items: stretch;
              flex-direction: column;
            }

            .conversation-graph-preview-status {
              width: 100%;
              text-align: left;
            }

            .conversation-graph-preview-canvas {
              height: 320px;
            }
          }
          '''
          if 'Read-only causal structure shown below' not in style:
              style_path.write_text(style.rstrip() + style_block + "\n", encoding="utf-8")

          test_path = Path("web/test/conversationMode.test.mjs")
          tests = test_path.read_text(encoding="utf-8")
          test_block = '''

          test("conversation remains mounted while workflow editors are opened", () => {
            assert.match(appSource, /className="conversation-page-host" hidden=\{!conversationOpen\}/);
            assert.match(appSource, /<ConversationPage onOpenStep=\{openStep\} active=\{conversationOpen\}/);
            assert.match(appSource, /className="workbench-page-host" hidden=\{conversationOpen\}/);
          });

          test("conversation shows a non-interactive causal graph below the chat", () => {
            assert.match(pageSource, /import GraphCanvas from "\.\.\/components\/GraphCanvas"/);
            assert.match(pageSource, /className="conversation-main-column"/);
            assert.match(pageSource, /className="conversation-graph-preview"/);
            assert.match(pageSource, /resultEdges=\{editedDiscoveryEdges\}/);
            assert.match(pageSource, /causalEdges=\{causalEdges\}/);
            assert.match(pageSource, /editable=\{false\}/);
            assert.match(styleSource, /\.conversation-graph-preview-canvas[\s\S]*pointer-events:\s*none/);
            assert.match(styleSource, /react-flow__controls[\s\S]*display:\s*none/);
          });
          '''
          if 'test("conversation remains mounted while workflow editors are opened"' not in tests:
              test_path.write_text(tests.rstrip() + test_block + "\n", encoding="utf-8")
          PY

      - name: Validate conversation graph preview
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/App.tsx web/src/pages/ConversationPage.tsx web/src/conversation-mode.css web/test/conversationMode.test.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Keep conversation state and preview causal graph"
          git push origin HEAD:agent/embed-conversation-graph-preview
