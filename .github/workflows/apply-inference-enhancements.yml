name: Apply inference enhancements

on:
  push:
    branches:
      - agent/inference-batch-and-scm

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/inference-batch-and-scm
          fetch-depth: 0

      - name: Apply implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              if old not in text:
                  raise RuntimeError(f"replacement target not found: {path}\n{old[:160]}")
              write(path, text.replace(old, new, 1))

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              text = read(path)
              start_index = text.index(start)
              end_index = text.index(end, start_index)
              write(path, text[:start_index] + replacement + text[end_index:])

          schemas = '''"""FastAPI入出力スキーマ。"""

          from typing import Literal

          from pydantic import BaseModel, Field


          AlgorithmName = Literal["PC", "DirectLiNGAM", "GES", "HillClimbSearch"]
          InferenceMethod = Literal["SCM", "LinearDML"]
          EdgeKind = Literal["directed", "undirected"]


          class EdgeDefinition(BaseModel):
              """方向付きエッジの定義。"""

              source: str = Field(min_length=1)
              target: str = Field(min_length=1)


          class DatasetResponse(BaseModel):
              """登録したデータセットの概要。"""

              dataset_id: str
              filename: str
              row_count: int
              columns: list[str]
              dtypes: dict[str, str]
              missing_counts: dict[str, int]


          class DiscoveryRequest(BaseModel):
              """因果構造探索リクエスト。"""

              dataset_id: str
              columns: list[str] = Field(min_length=2)
              model_name: AlgorithmName = "PC"
              scale: bool = True
              categorical_columns: list[str] = Field(default_factory=list)
              forbidden_parents: list[str] = Field(default_factory=list)
              forbidden_children: list[str] = Field(default_factory=list)
              forbidden_edges: list[EdgeDefinition] = Field(default_factory=list)
              required_edges: list[EdgeDefinition] = Field(default_factory=list)


          class GraphEdgeResponse(BaseModel):
              """画面表示用の探索結果エッジ。"""

              source: str
              target: str
              kind: EdgeKind
              weight: float | None = None


          class DiscoveryResponse(BaseModel):
              """因果構造探索結果。"""

              discovery_id: str
              dataset_id: str
              model_name: AlgorithmName
              backend: Literal["castle", "pgmpy"]
              columns: list[str]
              causal_matrix: list[list[float]]
              edges: list[GraphEdgeResponse]


          class InferenceRequest(BaseModel):
              """単一の因果効果推定リクエスト。"""

              dataset_id: str
              factor1: str = Field(min_length=1)
              factor2: str = Field(min_length=1)
              method: InferenceMethod = "LinearDML"
              discovery_id: str | None = None
              columns: list[str] = Field(default_factory=list)
              causal_matrix: list[list[float]] | None = None


          class InferenceResponse(BaseModel):
              """単一の因果効果推定結果。"""

              dataset_id: str
              discovery_id: str | None
              factor1: str
              factor2: str
              method: InferenceMethod
              effect: float
              interpretation: str


          class BatchInferenceRequest(BaseModel):
              """最終構造に含まれる全有向エッジの一括推定リクエスト。"""

              dataset_id: str
              method: InferenceMethod = "SCM"
              discovery_id: str | None = None
              columns: list[str] = Field(default_factory=list)
              causal_matrix: list[list[float]] | None = None


          class BatchInferenceResult(BaseModel):
              """一括推定における1エッジ分の結果。"""

              factor1: str
              factor2: str
              effect: float | None = None
              interpretation: str | None = None
              error: str | None = None


          class BatchInferenceResponse(BaseModel):
              """全有向エッジの一括推定結果。"""

              dataset_id: str
              discovery_id: str | None
              method: InferenceMethod
              result_count: int
              success_count: int
              failure_count: int
              results: list[BatchInferenceResult]


          class GraphValidationRequest(BaseModel):
              """Reactのグラフエディタから送られる制約定義。"""

              columns: list[str] = Field(min_length=1)
              causal_edges: list[EdgeDefinition] = Field(default_factory=list)
              required_edges: list[EdgeDefinition] = Field(default_factory=list)
              forbidden_edges: list[EdgeDefinition] = Field(default_factory=list)
              forbidden_parents: list[str] = Field(default_factory=list)
              forbidden_children: list[str] = Field(default_factory=list)


          class GraphValidationResponse(BaseModel):
              """グラフおよび制約の検証結果。"""

              valid: bool
              errors: list[str]
              warnings: list[str]


          class HealthResponse(BaseModel):
              """ヘルスチェック結果。"""

              status: Literal["ok"]
              service: str
          '''
          write("src/cauchan/api/schemas.py", schemas.replace("          ", ""))

          replace_once(
              "src/cauchan/api/services.py",
              "from .schemas import EdgeDefinition, GraphEdgeResponse, GraphValidationRequest",
              "from .schemas import (\n    BatchInferenceResult,\n    EdgeDefinition,\n    GraphEdgeResponse,\n    GraphValidationRequest,\n)",
          )

          batch_service = '''def run_batch_inference(
              *,
              dataframe: pd.DataFrame,
              columns: list[str],
              causal_matrix: np.ndarray,
              method: str,
          ) -> list[BatchInferenceResult]:
              """最終DAGに含まれる全有向エッジの因果効果を推定する。

              個別エッジの推定失敗は結果内のerrorへ格納し、他のエッジの
              推定を継続する。
              """
              validate_selected_columns(dataframe, columns, minimum=2)
              validate_numeric_data(dataframe, columns)

              from ..models.model import CausalInference

              model = CausalInference(
                  df=dataframe[columns],
                  columns=columns,
                  causal_matrix=causal_matrix,
              )
              dag = model._make_dag()
              edges = list(dag.edges())
              if not edges:
                  raise ServiceError("一括推定の対象となる有向エッジがありません。")

              results: list[BatchInferenceResult] = []
              for factor1, factor2 in edges:
                  try:
                      effect = float(
                          np.asarray(
                              model.estimate(
                                  factor1=factor1,
                                  factor2=factor2,
                                  method=method,
                              )
                          ).squeeze()
                      )
                      if not np.isfinite(effect):
                          raise ServiceError("推定結果が有限値ではありません。")
                      results.append(
                          BatchInferenceResult(
                              factor1=factor1,
                              factor2=factor2,
                              effect=effect,
                              interpretation=(
                                  f"{factor1}を1単位増加させたとき、"
                                  f"{factor2}は平均で{effect:.6g}単位変化すると推定されます。"
                              ),
                          )
                      )
                  except Exception as exc:  # 個別失敗は一括処理を止めない。
                      results.append(
                          BatchInferenceResult(
                              factor1=factor1,
                              factor2=factor2,
                              error=f"{type(exc).__name__}: {exc}",
                          )
                      )

              return results


          '''
          replace_once(
              "src/cauchan/api/services.py",
              "def validate_graph(request: GraphValidationRequest) -> tuple[list[str], list[str]]:",
              batch_service.replace("          ", "")
              + "def validate_graph(request: GraphValidationRequest) -> tuple[list[str], list[str]]:",
          )

          replace_once(
              "src/cauchan/api/services.py",
              "    effect = model.estimate(factor1=factor1, factor2=factor2, method=method)\n    return float(np.asarray(effect).squeeze())",
              "    effect = float(\n        np.asarray(\n            model.estimate(factor1=factor1, factor2=factor2, method=method)\n        ).squeeze()\n    )\n    if not np.isfinite(effect):\n        raise ServiceError(\"推定結果が有限値ではありません。\")\n    return effect",
          )

          estimate_method = '''    def estimate(self, factor1, factor2, method):
              """指定した2変数間の因果効果を推定する。

              SCMは介入変数の親ノードを調整変数とする線形回帰で推定する。
              LinearDMLはDoWhy/EconMLを利用する。
              """
              selected_data = self.df[self.columns]
              scaler = StandardScaler()
              selected_data = pd.DataFrame(
                  scaler.fit_transform(selected_data), columns=self.columns
              )

              if method == "SCM":
                  from sklearn.linear_model import LinearRegression

                  dag = self._make_dag()
                  adjustment_columns = list(dag.predecessors(factor1))
                  feature_columns = [factor1, *adjustment_columns]
                  regression = LinearRegression()
                  regression.fit(
                      selected_data[feature_columns],
                      selected_data[factor2],
                  )
                  causal_estimate = float(regression.coef_[0])
              elif method == "LinearDML":
                  from dowhy import CausalModel
                  from lightgbm import LGBMRegressor
                  from sklearn.ensemble import RandomForestRegressor

                  model_dowhy = CausalModel(
                      data=selected_data,
                      treatment=[factor1],
                      outcome=[factor2],
                      graph=self._make_graph_str(),
                  )
                  estimand = model_dowhy.identify_effect()
                  causal_estimate = model_dowhy.estimate_effect(
                      identified_estimand=estimand,
                      method_name="backdoor.econml.dml.LinearDML",
                      target_units="ate",
                      method_params={
                          "init_params": {
                              "model_y": LGBMRegressor(
                                  n_estimators=100,
                                  max_depth=10,
                                  learning_rate=0.01,
                                  verbose=-1,
                              ),
                              "model_t": RandomForestRegressor(),
                              "discrete_treatment": False,
                          },
                          "fit_params": {},
                      },
                  ).value
              else:
                  raise ValueError("method must be either 'SCM' or 'LinearDML'")

              treat_idx = self.columns.index(factor1)
              outcome_idx = self.columns.index(factor2)
              return (
                  float(np.asarray(causal_estimate).squeeze())
                  * scaler.scale_[outcome_idx]
                  / scaler.scale_[treat_idx]
              )

'''
          replace_between(
              "src/cauchan/models/model.py",
              "    def estimate(self, factor1, factor2, method):\n",
              "    def _make_dag(self):\n",
              estimate_method.replace("          ", ""),
          )

          replace_once(
              "src/cauchan/api/app.py",
              "    DatasetResponse,\n    DiscoveryRequest,",
              "    BatchInferenceRequest,\n    BatchInferenceResponse,\n    DatasetResponse,\n    DiscoveryRequest,",
          )
          replace_once(
              "src/cauchan/api/app.py",
              "    run_discovery,\n    run_inference,",
              "    run_batch_inference,\n    run_discovery,\n    run_inference,",
          )
          replace_once(
              "src/cauchan/api/app.py",
              "    except (ServiceError, ValueError) as exc:\n        raise _bad_request(ServiceError(str(exc))) from exc\n\n    return InferenceResponse(",
              "    except (ServiceError, ValueError) as exc:\n        raise _bad_request(ServiceError(str(exc))) from exc\n    except Exception as exc:\n        raise HTTPException(\n            status_code=status.HTTP_500_INTERNAL_SERVER_ERROR,\n            detail=(\n                \"因果効果推定中に予期しないエラーが発生しました: \"\n                f\"{type(exc).__name__}: {exc}\"\n            ),\n        ) from exc\n\n    return InferenceResponse(",
          )

          batch_endpoint = '''@app.post("/api/v1/inference/batch", response_model=BatchInferenceResponse)
          def infer_batch(request: BatchInferenceRequest) -> BatchInferenceResponse:
              """最終構造に含まれる全有向エッジの効果を一括推定する。"""
              dataset = store.get_dataset(request.dataset_id)
              if dataset is None:
                  raise HTTPException(status_code=404, detail="データセットが見つかりません。")

              try:
                  discovery_id, columns, causal_matrix = resolve_inference_graph(
                      store=store,
                      dataset_id=request.dataset_id,
                      discovery_id=request.discovery_id,
                      columns=request.columns,
                      causal_matrix=request.causal_matrix,
                  )
                  results = run_batch_inference(
                      dataframe=dataset.dataframe,
                      columns=columns,
                      causal_matrix=causal_matrix,
                      method=request.method,
                  )
              except (ServiceError, ValueError) as exc:
                  raise _bad_request(ServiceError(str(exc))) from exc
              except Exception as exc:
                  raise HTTPException(
                      status_code=status.HTTP_500_INTERNAL_SERVER_ERROR,
                      detail=(
                          "一括因果効果推定中に予期しないエラーが発生しました: "
                          f"{type(exc).__name__}: {exc}"
                      ),
                  ) from exc

              success_count = sum(result.effect is not None for result in results)
              return BatchInferenceResponse(
                  dataset_id=request.dataset_id,
                  discovery_id=discovery_id,
                  method=request.method,
                  result_count=len(results),
                  success_count=success_count,
                  failure_count=len(results) - success_count,
                  results=results,
              )


          '''
          replace_once(
              "src/cauchan/api/app.py",
              "@app.post(\"/api/v1/graphs/validate\", response_model=GraphValidationResponse)",
              batch_endpoint.replace("          ", "")
              + "@app.post(\"/api/v1/graphs/validate\", response_model=GraphValidationResponse)",
          )

          types_path = "web/src/types.ts"
          types_text = read(types_path)
          replace_once(
              types_path,
              "export type InferenceResponse = {\n  dataset_id: string;\n  discovery_id: string | null;\n  factor1: string;\n  factor2: string;\n  method: InferenceMethod;\n  effect: number;\n  interpretation: string;\n};",
              "export type InferenceResponse = {\n  dataset_id: string;\n  discovery_id: string | null;\n  factor1: string;\n  factor2: string;\n  method: InferenceMethod;\n  effect: number;\n  interpretation: string;\n};\n\nexport type BatchInferenceResult = {\n  factor1: string;\n  factor2: string;\n  effect: number | null;\n  interpretation: string | null;\n  error: string | null;\n};\n\nexport type BatchInferenceResponse = {\n  dataset_id: string;\n  discovery_id: string | null;\n  method: InferenceMethod;\n  result_count: number;\n  success_count: number;\n  failure_count: number;\n  results: BatchInferenceResult[];\n};",
          )

          replace_once(
              "web/src/api.ts",
              "  DatasetResponse,\n  DiscoveryResponse,",
              "  BatchInferenceResponse,\n  DatasetResponse,\n  DiscoveryResponse,",
          )
          replace_once(
              "web/src/api.ts",
              "async function request<T>(path: string, init?: RequestInit): Promise<T> {\n  const response = await fetch(`${API_BASE_URL}${path}`, init);",
              "async function request<T>(path: string, init?: RequestInit): Promise<T> {\n  let response: Response;\n  try {\n    response = await fetch(`${API_BASE_URL}${path}`, init);\n  } catch (error) {\n    const detail = error instanceof Error ? error.message : String(error);\n    throw new Error(`APIへ接続できませんでした (${API_BASE_URL}): ${detail}`);\n  }",
          )
          replace_once(
              "web/src/api.ts",
              "  infer(payload: {\n    dataset_id: string;\n    factor1: string;\n    factor2: string;\n    method: InferenceMethod;\n    discovery_id?: string;\n    columns?: string[];\n    causal_matrix?: number[][];\n  }): Promise<InferenceResponse> {\n    return request(\"/inference\", {\n      method: \"POST\",\n      headers: { \"Content-Type\": \"application/json\" },\n      body: JSON.stringify(payload),\n    });\n  },",
              "  infer(payload: {\n    dataset_id: string;\n    factor1: string;\n    factor2: string;\n    method: InferenceMethod;\n    discovery_id?: string;\n    columns?: string[];\n    causal_matrix?: number[][];\n  }): Promise<InferenceResponse> {\n    return request(\"/inference\", {\n      method: \"POST\",\n      headers: { \"Content-Type\": \"application/json\" },\n      body: JSON.stringify(payload),\n    });\n  },\n\n  inferBatch(payload: {\n    dataset_id: string;\n    method: InferenceMethod;\n    discovery_id?: string;\n    columns?: string[];\n    causal_matrix?: number[][];\n  }): Promise<BatchInferenceResponse> {\n    return request(\"/inference/batch\", {\n      method: \"POST\",\n      headers: { \"Content-Type\": \"application/json\" },\n      body: JSON.stringify(payload),\n    });\n  },",
          )

          inference_page = '''import { useEffect, useMemo, useState, type CSSProperties } from "react";
          import { api } from "../api";
          import GraphCanvas from "../components/GraphCanvas";
          import { edgesToMatrix, useWorkbench } from "../context/WorkbenchContext";
          import type {
            BatchInferenceResponse,
            BatchInferenceResult,
            GraphEdgeResponse,
            InferenceMethod,
            InferenceSource,
          } from "../types";

          type ResultView = "list" | "heatmap";

          function pairKey(factor1: string, factor2: string): string {
            return `${factor1}\u0000${factor2}`;
          }

          function formatEffect(effect: number | null): string {
            if (effect === null || !Number.isFinite(effect)) return "—";
            if (effect === 0) return "0";
            return Math.abs(effect) >= 1000 || Math.abs(effect) < 0.001
              ? effect.toExponential(3)
              : effect.toPrecision(5);
          }

          function heatCellStyle(effect: number, maxAbsEffect: number): CSSProperties {
            const ratio = maxAbsEffect > 0 ? Math.min(Math.abs(effect) / maxAbsEffect, 1) : 0;
            const alpha = 0.12 + ratio * 0.78;
            return {
              backgroundColor: effect >= 0
                ? `rgba(37, 99, 235, ${alpha})`
                : `rgba(217, 45, 32, ${alpha})`,
              color: ratio > 0.52 ? "#ffffff" : "var(--text)",
            };
          }

          export default function InferencePage() {
            const {
              dataset,
              selectedColumns,
              structureSource,
              setStructureSource,
              causalEdges,
              validation,
              discovery,
              editedDiscoveryEdges,
              discoveryValidation,
              unresolvedDiscoveryEdges,
              inference,
              runInference,
              setError,
            } = useWorkbench();
            const source: InferenceSource = structureSource;
            const [factor1, setFactor1] = useState("");
            const [factor2, setFactor2] = useState("");
            const [method, setMethod] = useState<InferenceMethod>("LinearDML");
            const [batchInference, setBatchInference] = useState<BatchInferenceResponse | null>(null);
            const [batchBusy, setBatchBusy] = useState(false);
            const [resultView, setResultView] = useState<ResultView>("list");

            const columns = source === "discovery" ? discovery?.columns ?? [] : selectedColumns;
            const displayEdges = useMemo<GraphEdgeResponse[]>(() => (
              source === "discovery"
                ? editedDiscoveryEdges
                : causalEdges.map((edge) => ({ ...edge, kind: "directed", weight: 1 }))
            ), [source, editedDiscoveryEdges, causalEdges]);
            const directedEdges = useMemo(
              () => displayEdges
                .filter((edge) => edge.kind === "directed")
                .map(({ source: edgeSource, target }) => ({ source: edgeSource, target })),
              [displayEdges],
            );
            const sourceValidation = source === "discovery" ? discoveryValidation : validation;
            const directedCount = directedEdges.length;
            const ready = Boolean(
              directedCount > 0
              && sourceValidation?.valid !== false
              && (source === "manual" || (discovery && unresolvedDiscoveryEdges === 0)),
            );
            const graphSignature = useMemo(
              () => directedEdges.map((edge) => `${edge.source}->${edge.target}`).sort().join("|"),
              [directedEdges],
            );
            const resultMap = useMemo(
              () => new Map(
                (batchInference?.results ?? []).map((result) => [
                  pairKey(result.factor1, result.factor2),
                  result,
                ]),
              ),
              [batchInference],
            );
            const maxAbsEffect = useMemo(
              () => Math.max(
                0,
                ...(batchInference?.results ?? [])
                  .filter((result): result is BatchInferenceResult & { effect: number } => result.effect !== null)
                  .map((result) => Math.abs(result.effect)),
              ),
              [batchInference],
            );

            useEffect(() => {
              if (!columns.includes(factor1)) setFactor1(columns[0] ?? "");
              if (!columns.includes(factor2) || factor2 === factor1) {
                setFactor2(columns.find((column) => column !== factor1) ?? "");
              }
            }, [columns, factor1, factor2]);

            useEffect(() => {
              setBatchInference(null);
            }, [source, method, graphSignature]);

            const runBatchInference = async () => {
              if (!dataset || !ready || !directedEdges.length) return;
              setBatchBusy(true);
              setError(null);
              try {
                const result = await api.inferBatch({
                  dataset_id: dataset.dataset_id,
                  method,
                  columns,
                  causal_matrix: edgesToMatrix(columns, directedEdges),
                });
                setBatchInference(result);
              } catch (requestError) {
                setError(requestError instanceof Error ? requestError.message : String(requestError));
              } finally {
                setBatchBusy(false);
              }
            };

            return (
              <>
                <header className="section-header">
                  <div>
                    <span className="eyebrow">STEP 04 · INFERENCE</span>
                    <h2>最終因果構造で因果効果を推定</h2>
                    <p>個別の変数ペア、または最終構造に含まれる全有向エッジの因果効果を推定します。</p>
                  </div>
                  <span className={`status-chip ${inference || batchInference ? "success" : ""}`}>
                    {inference || batchInference ? "推定済み" : "未実行"}
                  </span>
                </header>

                <div className="inference-layout">
                  <section className="panel inference-settings">
                    <div className="panel-title"><div><span>FINAL GRAPH SOURCE</span><h3>推論に使う構造</h3></div></div>
                    <div className="source-switch">
                      <button
                        type="button"
                        className={source === "manual" ? "active" : "secondary"}
                        disabled={!causalEdges.length}
                        onClick={() => setStructureSource("manual")}
                      >
                        <span>→</span><strong>手動構造</strong><small>{causalEdges.length} edges · Knowledgeで定義</small>
                      </button>
                      <button
                        type="button"
                        className={source === "discovery" ? "active" : "secondary"}
                        disabled={!discovery}
                        onClick={() => setStructureSource("discovery")}
                      >
                        <span>◎</span><strong>探索後編集構造</strong><small>{discovery ? `${directedCount} directed` : "未実行"}</small>
                      </button>
                    </div>

                    <div className={`selected-structure-summary ${ready ? "ready" : "not-ready"}`}>
                      <div>
                        <span>SELECTED STRUCTURE</span>
                        <strong>{source === "manual" ? "手動定義をそのまま使用" : "探索結果を編集した最終構造"}</strong>
                      </div>
                      <span className={`status-chip ${ready ? "success" : "warning"}`}>
                        {ready ? "推論可能" : "要確認"}
                      </span>
                    </div>

                    <div className="form-grid">
                      <label>
                        <span>factor1 · 介入変数</span>
                        <select value={factor1} onChange={(event) => setFactor1(event.target.value)}>
                          {columns.map((column) => <option key={column} value={column}>{column}</option>)}
                        </select>
                      </label>
                      <div className="direction-arrow">→</div>
                      <label>
                        <span>factor2 · 結果変数</span>
                        <select value={factor2} onChange={(event) => setFactor2(event.target.value)}>
                          {columns.filter((column) => column !== factor1).map((column) => (
                            <option key={column} value={column}>{column}</option>
                          ))}
                        </select>
                      </label>
                    </div>

                    <div className="settings-block">
                      <div className="settings-title"><span>ESTIMATOR</span><strong>推定手法</strong></div>
                      <div className="method-cards">
                        <button type="button" className={method === "LinearDML" ? "active" : "secondary"} onClick={() => setMethod("LinearDML")}>
                          <strong>LinearDML</strong><small>機械学習で交絡を調整</small>
                        </button>
                        <button type="button" className={method === "SCM" ? "active" : "secondary"} onClick={() => setMethod("SCM")}>
                          <strong>SCM</strong><small>親変数調整付き線形回帰</small>
                        </button>
                      </div>
                    </div>

                    {source === "discovery" && unresolvedDiscoveryEdges > 0 && (
                      <p className="inline-warning">Discovery画面で未方向エッジ{unresolvedDiscoveryEdges}件の方向を確定してください。</p>
                    )}
                    {!!sourceValidation?.errors.length && (
                      <ul className="validation-list error-list inference-validation-list">
                        {sourceValidation.errors.map((message) => <li key={message}>{message}</li>)}
                      </ul>
                    )}
                    {!!sourceValidation?.warnings.length && (
                      <ul className="validation-list warning-list inference-validation-list">
                        {sourceValidation.warnings.map((message) => <li key={message}>{message}</li>)}
                      </ul>
                    )}

                    <div className="inference-action-stack">
                      <button
                        type="button"
                        className="primary-action"
                        disabled={!ready || batchBusy || !factor1 || !factor2 || factor1 === factor2}
                        onClick={() => void runInference(factor1, factor2, method, source)}
                      >
                        {factor1 || "factor1"} → {factor2 || "factor2"} の効果を推定
                      </button>
                      <button
                        type="button"
                        className="primary-action secondary batch-inference-action"
                        disabled={!ready || batchBusy}
                        onClick={() => void runBatchInference()}
                      >
                        {batchBusy ? "全エッジを推定中..." : `有効な全${directedCount}エッジを一括推定`}
                      </button>
                      <small className="action-note">一括推定は最終構造に存在する有向エッジのみを対象にします。</small>
                    </div>
                  </section>

                  <section className="panel inference-graph-panel">
                    <div className="panel-title">
                      <div>
                        <span>FINAL CAUSAL GRAPH</span>
                        <h3>{source === "manual" ? "手動構造" : "探索後編集構造"}</h3>
                      </div>
                      <span className={`status-chip ${ready ? "success" : "warning"}`}>{directedCount} edges</span>
                    </div>
                    {displayEdges.length ? (
                      <GraphCanvas columns={columns} resultEdges={displayEdges} editable={false} />
                    ) : (
                      <div className="result-empty">
                        <div>→</div>
                        <strong>利用可能な構造がありません</strong>
                        <p>Knowledge画面で手動構造を作成するか、Discovery画面で探索結果を編集してください。</p>
                      </div>
                    )}
                  </section>
                </div>

                {inference && (
                  <section className="panel inference-result">
                    <div className="inference-result-main">
                      <span>AVERAGE CAUSAL EFFECT</span>
                      <div className="effect-direction"><strong>{inference.factor1}</strong><i>→</i><strong>{inference.factor2}</strong></div>
                      <div className="effect-value">{Number(inference.effect).toPrecision(7)}</div>
                      <p>{inference.interpretation}</p>
                    </div>
                    <div className="inference-result-meta">
                      <div><span>Method</span><strong>{inference.method}</strong></div>
                      <div><span>Graph</span><strong>{source === "manual" ? "Manual" : "Discovery + Edit"}</strong></div>
                      <div><span>Unit</span><strong>factor2 / factor1</strong></div>
                    </div>
                  </section>
                )}

                {batchInference && (
                  <section className="panel batch-inference-result">
                    <div className="panel-title batch-result-header">
                      <div>
                        <span>ALL DIRECTED EDGES</span>
                        <h3>有効エッジの一括因果効果</h3>
                      </div>
                      <div className="batch-view-switch">
                        <button type="button" className={resultView === "list" ? "active" : "secondary"} onClick={() => setResultView("list")}>一覧</button>
                        <button type="button" className={resultView === "heatmap" ? "active" : "secondary"} onClick={() => setResultView("heatmap")}>ヒートマップ</button>
                      </div>
                    </div>

                    <div className="batch-result-summary">
                      <div><small>Method</small><strong>{batchInference.method}</strong></div>
                      <div><small>Edges</small><strong>{batchInference.result_count}</strong></div>
                      <div className="success"><small>Success</small><strong>{batchInference.success_count}</strong></div>
                      <div className={batchInference.failure_count ? "failure" : ""}><small>Failed</small><strong>{batchInference.failure_count}</strong></div>
                    </div>

                    {resultView === "list" ? (
                      <div className="table-wrap batch-result-table-wrap">
                        <table className="batch-result-table">
                          <thead>
                            <tr><th>介入変数</th><th>結果変数</th><th>因果効果</th><th>状態</th></tr>
                          </thead>
                          <tbody>
                            {batchInference.results.map((result) => (
                              <tr key={pairKey(result.factor1, result.factor2)}>
                                <td><strong>{result.factor1}</strong></td>
                                <td><strong>{result.factor2}</strong></td>
                                <td className={result.effect !== null && result.effect < 0 ? "negative-effect" : "positive-effect"}>
                                  {formatEffect(result.effect)}
                                </td>
                                <td>
                                  {result.error
                                    ? <span className="status-dot-label warning" title={result.error}>失敗 · {result.error}</span>
                                    : <span className="status-dot-label success">成功</span>}
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    ) : (
                      <>
                        <div className="heatmap-legend">
                          <span className="negative">負の効果</span>
                          <i />
                          <span>0付近</span>
                          <i />
                          <span className="positive">正の効果</span>
                        </div>
                        <div className="table-wrap effect-heatmap-wrap">
                          <table className="effect-heatmap">
                            <thead><tr><th>from ＼ to</th>{columns.map((column) => <th key={column}>{column}</th>)}</tr></thead>
                            <tbody>
                              {columns.map((row) => (
                                <tr key={row}>
                                  <th>{row}</th>
                                  {columns.map((column) => {
                                    const result = resultMap.get(pairKey(row, column));
                                    if (row === column) return <td key={column} className="diagonal">—</td>;
                                    if (!result) return <td key={column} className="no-edge">·</td>;
                                    if (result.effect === null) return <td key={column} className="failed" title={result.error ?? "推定失敗"}>!</td>;
                                    return (
                                      <td
                                        key={column}
                                        className="effect-cell"
                                        style={heatCellStyle(result.effect, maxAbsEffect)}
                                        title={`${row} → ${column}: ${result.effect}`}
                                      >
                                        {formatEffect(result.effect)}
                                      </td>
                                    );
                                  })}
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </>
                    )}
                  </section>
                )}
              </>
            );
          }
          '''
          write("web/src/pages/InferencePage.tsx", inference_page.replace("          ", ""))

          inference_css = '''.inference-action-stack {
            display: grid;
            gap: 10px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
          }

          .batch-inference-action {
            border-color: color-mix(in srgb, var(--primary) 32%, var(--line)) !important;
            color: var(--primary) !important;
            background: var(--primary-soft) !important;
          }

          .action-note {
            color: var(--muted);
            font-size: 9px;
            line-height: 1.5;
          }

          .inference-validation-list {
            margin-top: 12px;
          }

          .batch-result-header {
            align-items: center;
          }

          .batch-view-switch {
            display: flex;
            gap: 8px;
          }

          .batch-view-switch button {
            min-height: 34px;
            padding: 6px 12px;
          }

          .batch-result-summary {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 16px;
          }

          .batch-result-summary > div {
            display: grid;
            gap: 3px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface-subtle);
          }

          .batch-result-summary small {
            color: var(--muted);
            font-size: 8px;
            font-weight: 750;
            letter-spacing: .08em;
            text-transform: uppercase;
          }

          .batch-result-summary strong {
            font-size: 19px;
          }

          .batch-result-summary .success strong { color: var(--success); }
          .batch-result-summary .failure strong { color: var(--danger); }

          .batch-result-table-wrap {
            max-height: 520px;
          }

          .batch-result-table td:nth-child(3) {
            font-variant-numeric: tabular-nums;
            font-weight: 760;
          }

          .positive-effect { color: var(--primary); }
          .negative-effect { color: var(--danger); }

          .batch-result-table .status-dot-label.warning {
            max-width: 420px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .heatmap-legend {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            color: var(--muted);
            font-size: 9px;
          }

          .heatmap-legend i {
            width: 36px;
            height: 8px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(217, 45, 32, .85), var(--surface-subtle), rgba(37, 99, 235, .85));
          }

          .heatmap-legend .negative { color: var(--danger); }
          .heatmap-legend .positive { color: var(--primary); }

          .effect-heatmap-wrap {
            max-height: 650px;
          }

          .effect-heatmap th,
          .effect-heatmap td {
            min-width: 76px;
            padding: 9px;
            text-align: center;
            font-size: 9px;
            font-variant-numeric: tabular-nums;
          }

          .effect-heatmap thead th,
          .effect-heatmap tbody th {
            position: sticky;
            z-index: 2;
          }

          .effect-heatmap thead th { top: 0; }
          .effect-heatmap tbody th { left: 0; }
          .effect-heatmap thead th:first-child { left: 0; z-index: 3; }
          .effect-heatmap .diagonal { color: var(--subtle); background: var(--surface-strong); }
          .effect-heatmap .no-edge { color: var(--subtle); }
          .effect-heatmap .failed { color: var(--danger); background: var(--danger-soft); font-weight: 850; }
          .effect-heatmap .effect-cell { font-weight: 780; }

          @media (max-width: 700px) {
            .batch-result-header { align-items: stretch; flex-direction: column; }
            .batch-view-switch { width: 100%; }
            .batch-view-switch button { flex: 1; }
            .batch-result-summary { grid-template-columns: repeat(2, 1fr); }
          }
          '''
          write("web/src/inference-results.css", inference_css.replace("          ", ""))
          replace_once(
              "web/src/main.tsx",
              'import "./graph-interactions.css";\n',
              'import "./graph-interactions.css";\nimport "./inference-results.css";\n',
          )

          replace_once(
              ".github/workflows/web.yml",
              '      - "src/cauchan/api/app.py"\n',
              '      - "src/cauchan/api/app.py"\n      - "src/cauchan/api/schemas.py"\n      - "src/cauchan/api/services.py"\n      - "src/cauchan/models/model.py"\n',
          )
          replace_once(
              ".github/workflows/web.yml",
              '      - "src/cauchan/api/app.py"\n      - "tests/test_web_port_configuration.py"',
              '      - "src/cauchan/api/app.py"\n      - "src/cauchan/api/schemas.py"\n      - "src/cauchan/api/services.py"\n      - "src/cauchan/models/model.py"\n      - "tests/test_web_port_configuration.py"',
          )
          replace_once(
              ".github/workflows/web.yml",
              "      - name: Install dependencies\n        working-directory: web",
              "      - name: Validate Python syntax\n        run: python -m compileall -q src/cauchan/api src/cauchan/models/model.py\n      - name: Install dependencies\n        working-directory: web",
          )

          docs_path = "docs/fastapi.md"
          if Path(docs_path).exists():
              docs = read(docs_path)
              docs += '''\n\n## 全有向エッジの一括推定\n\n`POST /api/v1/inference/batch`は、指定された最終DAGに存在する全有向エッジを対象に因果効果を推定します。個別エッジの失敗は`results[].error`へ格納され、他のエッジの処理は継続します。\n\nSCMは介入変数の親ノードを調整変数とする線形回帰です。LinearDMLはDoWhy/EconMLを利用するため、エッジ数が多い場合は計算時間が長くなります。\n'''
              write(docs_path, docs)

          web_docs_path = "docs/webapp.md"
          if Path(web_docs_path).exists():
              docs = read(web_docs_path)
              docs += '''\n\n## 有効エッジの一括因果効果\n\nInference画面の「有効な全エッジを一括推定」では、最終構造に存在する有向エッジをまとめて推定できます。結果は一覧とヒートマップを切り替えて確認できます。推定に失敗したエッジは警告として表示され、成功したエッジの結果は保持されます。\n'''
              write(web_docs_path, docs)
          PY

          rm .github/workflows/apply-inference-enhancements.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "推論画面と一括効果推定を改善"
          git push origin HEAD:agent/inference-batch-and-scm
